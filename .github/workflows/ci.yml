name: CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
  features:
    # the library must build, lint and test with every optional feature off
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["--no-default-features", "--no-default-features --features sign", "--no-default-features --features binary"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --locked ${{ matrix.features }} -- -D warnings
      - run: cargo test --locked ${{ matrix.features }}
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo doc --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
  audit-self:
    # dogfood the Action: the SBOM this crate generates for itself must pass its own audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --path . --locked
      - run: sbom-attest generate --locked --cdx sbom.cdx.json
      - uses: ./
        with:
          sbom: sbom.cdx.json
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo build --locked
      - run: cargo build --locked --lib --no-default-features
  conformance:
    # CycloneDX 1.6 schema + cyclonedx-cli, pyspdxtools, sbomqs CISA 2026 gate,
    # differential vs cargo-cyclonedx 0.5.10 and syft, reproducibility, cosign verification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build cmake libgtest-dev python3-venv
      - run: bash ci/conformance.sh "$RUNNER_TEMP/sbom-attest-ci"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-results
          path: ${{ runner.temp }}/sbom-attest-ci/results
